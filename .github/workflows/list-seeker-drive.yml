name: List Seeker Drive Assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  list:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve public Drive folder manifest
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip gdown
          gdown "https://drive.google.com/drive/folders/1nBAP8JjbqvqDgIhzdESU_GjmuG3QWQDZ" \
            --folder --json --quiet > .seeker-drive-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('.seeker-drive-manifest.json').read_text(encoding='utf-8'))
          print(f'{len(rows)} files resolved')
          for row in rows:
              print(row['path'], row['url'])
          PY
      - name: Publish manifest pointer
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .seeker-drive-manifest.json
          git commit -m 'chore: publish temporary Seeker Drive manifest'
          git push
